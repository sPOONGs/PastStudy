<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>소프트웨어 기술 선호에 관한 설문</title>
<link href="s5.css" type="text/css" rel="stylesheet">
</head>

<body>
<header class = "header">
<h1>설문지</h1>
<p class="p1">소프트웨어 기술에 대한 의견을 듣습니다. 많은 참여 부탁드립니다.</p>
</header>
<form class = "section">
	<span class="span1">학년</span>
	<input type="radio" name="class" value="1"checked><span class="span2">1학년
	<input type="radio" name="class" value="2">2학년
	<input type="radio" name="class" value="3">3학년
	<input type="radio" name="class" value="4">4학년</span>
	<br><br>

	<span class="span1">성별</span>
	<input type="radio" name="gender" value="1"><span class="span2">남
	<input type="radio" name="gender" value="2">여</span>
	<br><br>

	<span class="span1">관심분야</span>
	<select name="area">
		<option value="1"selected>모바일 소프트웨어</option>
		<option value="2">웹 서비스</option>
		<option value="3">빅데이터</option>
		<option value="4">디지털 콘텐츠 및 가상현실</option>
	</select>
	<br><br>

	<span class="span1">진로(다중선택)</span>
	<input type="checkbox" value="1"checked><span class="span2">개발
	<input type="checkbox" value="2">기획
	<input type="checkbox" value="3">영업
	<input type="checkbox" value="4">창업</span>
	<br><br>

	<span class="span1">남기고 싶은 말</span>
	<textarea cols="50" rows="10" placeholder="글을 남겨주세요"></textarea>
</form>
<footer class = "footer">
<p class="p1">Copyright 2022 by Kitae</p>
</footer>
